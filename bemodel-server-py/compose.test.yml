services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: bemodel-isolated-test-only
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${BEMODEL_TEST_MYSQL_PORT:-13316}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pbemodel-isolated-test-only"]
      interval: 3s
      timeout: 3s
      retries: 30
