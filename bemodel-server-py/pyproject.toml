[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bemodel-server"
version = "1.0.0"
description = "BeModel Python backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.36,<2.1", "pymysql>=1.1,<2",
  "cryptography>=43", "PyJWT>=2.9,<3", "bcrypt>=4,<5",
  "pydantic-settings>=2.6,<3", "rdflib>=7.1,<8", "pyshacl>=0.28,<0.31",
  "httpx>=0.27,<1", "APScheduler>=3.10,<4", "python-multipart>=0.0.18",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bemodel = ["db/migration/*.sql", "resources/shacl/*.ttl", "resources/seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires isolated MySQL test databases"]
