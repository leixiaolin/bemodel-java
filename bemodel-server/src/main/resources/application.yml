server:
  port: 18080

spring:
  application:
    name: bemodel-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/bemodel_platform?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      demo_db_username: ${MYSQL_USERNAME:root}
      demo_db_password: ${MYSQL_PASSWORD:123456}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

deepseek:
  base-url: https://api.deepseek.com
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-v4-flash
  timeout-seconds: 30

# 安全：JWT 签名密钥 / 字段级加密密钥（默认值为演示便利，生产必须经环境变量覆盖）
jwt:
  secret: ${JWT_SECRET:}
app:
  secret-key: ${APP_SECRET_KEY:}

# 指标定时巡检（cron 六字段含秒，默认每 30 分钟；手动触发 POST /api/inspect/run）
bemodel:
  inspect:
    cron: "0 0/30 * * * *"

logging:
  level:
    com.bemodel: info
